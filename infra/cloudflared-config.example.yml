# Cloudflare Tunnel config — copy to the ct-cloudflared container as
# ~/.cloudflared/config.yml and fill in your tunnel UUID.
# See Technical-Setup-Guide.md §2. Replace 10.0.0.x with your LAN IPs.
tunnel: REPLACE-WITH-TUNNEL-UUID
credentials-file: /root/.cloudflared/REPLACE-WITH-TUNNEL-UUID.json

ingress:
  # Public app + API (on the VPS in Phase 1, on home in Phase 0)
  - hostname: app.yourdomain.in
    service: http://10.0.0.20:3001        # Next.js web
  - hostname: api.yourdomain.in
    service: http://10.0.0.20:3000        # Fastify API (WhatsApp webhook lives here)

  # Internal tools — ALSO put these behind Cloudflare Access (Zero Trust)
  - hostname: n8n.yourdomain.in
    service: http://10.0.0.30:5678
  - hostname: bot.yourdomain.in
    service: http://10.0.0.30:8080        # Typebot viewer
  - hostname: chat.yourdomain.in
    service: http://10.0.0.30:3001        # Chatwoot
  - hostname: social.yourdomain.in
    service: http://10.0.0.30:8000        # Mixpost
  - hostname: book.yourdomain.in
    service: http://10.0.0.30:3002        # Cal.com
  - hostname: metrics.yourdomain.in
    service: http://10.0.0.30:3003        # Metabase

  # Catch-all (required, must be last)
  - service: http_status:404
