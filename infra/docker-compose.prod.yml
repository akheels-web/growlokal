# GrowLokal Production VPS Docker Compose Stack
# Optimized for 2 vCPU / 8 GB RAM VPS
# Usage: docker compose -f infra/docker-compose.prod.yml up -d --build

version: "3.8"

services:
  postgres:
    image: postgres:16-alpine
    container_name: growlokal_prod_db
    restart: always
    environment:
      POSTGRES_USER: ${PG_USER:-growlokal}
      POSTGRES_PASSWORD: ${PG_PASSWORD:?Set PG_PASSWORD in .env}
      POSTGRES_DB: ${PG_DB:-growlokal}
    volumes:
      - pg_prod_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:5432:5432"
    deploy:
      resources:
        limits:
          memory: 3500M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-growlokal} -d ${PG_DB:-growlokal}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: growlokal_prod_redis
    restart: always
    command: redis-server --save 60 1 --loglevel warning --maxmemory 1200mb --maxmemory-policy volatile-lru
    volumes:
      - redis_prod_data:/data
    deploy:
      resources:
        limits:
          memory: 1500M

  api:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: growlokal_prod_api
    restart: always
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgres://${PG_USER:-growlokal}:${PG_PASSWORD}@postgres:5432/${PG_DB:-growlokal}
      REDIS_URL: redis://redis:6379
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      PUBLIC_API_URL: https://${API_DOMAIN:-api.growlokal.com}
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN:?Set WHATSAPP_VERIFY_TOKEN in .env}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET:?Set WHATSAPP_APP_SECRET in .env (Meta App Secret, verifies webhook signatures)}
      WHATSAPP_RENEWAL_TEMPLATE_NAME: ${WHATSAPP_RENEWAL_TEMPLATE_NAME}
      WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_NAME: ${WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_NAME}
      WHATSAPP_WEBSITE_REQUEST_TEMPLATE_NAME: ${WHATSAPP_WEBSITE_REQUEST_TEMPLATE_NAME}
      WHATSAPP_GBP_NO_LOCATIONS_TEMPLATE_NAME: ${WHATSAPP_GBP_NO_LOCATIONS_TEMPLATE_NAME}
      OPS_ALERT_PHONE: ${OPS_ALERT_PHONE}
      OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL}
      DASHBOARD_LOGIN_URL: https://${WEB_DOMAIN:-app.growlokal.com}/login
      WEB_APP_BASE_URL: https://${WEB_DOMAIN:-app.growlokal.com}
      SES_REGION: ${SES_REGION:-ap-south-1}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-hello@growlokal.com}
      # Found missing while wiring the GBP OAuth flow (2026-08-18) — these
      # existed in config.ts/.env.example already but were never actually
      # passed through here, for EVERY chunk that added them this session.
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL_CHEAP: ${LLM_MODEL_CHEAP}
      LLM_MODEL_QUALITY: ${LLM_MODEL_QUALITY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL_CHEAP: ${OPENROUTER_MODEL_CHEAP}
      OPENROUTER_MODEL_QUALITY: ${OPENROUTER_MODEL_QUALITY}
      OPENROUTER_MODEL_IMAGE: ${OPENROUTER_MODEL_IMAGE}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      QUICKCHART_BASE_URL: ${QUICKCHART_BASE_URL:-https://quickchart.io}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-growlokal-media}
      R2_PUBLIC_URL_BASE: ${R2_PUBLIC_URL_BASE}
      GBP_ACCESS_TOKEN: ${GBP_ACCESS_TOKEN}
      GBP_CLIENT_ID: ${GBP_CLIENT_ID}
      GBP_CLIENT_SECRET: ${GBP_CLIENT_SECRET}
      GBP_REDIRECT_URI: https://${API_DOMAIN:-api.growlokal.com}/api/gbp/oauth/callback
      MIXPOST_BASE_URL: ${MIXPOST_BASE_URL}
      MIXPOST_TOKEN: ${MIXPOST_TOKEN}
      MIXPOST_WORKSPACE_UUID: ${MIXPOST_WORKSPACE_UUID}
      RAZORPAY_KEY_ID: ${RAZORPAY_KEY_ID}
      RAZORPAY_KEY_SECRET: ${RAZORPAY_KEY_SECRET}
      RAZORPAY_WEBHOOK_SECRET: ${RAZORPAY_WEBHOOK_SECRET}
      RAZORPAY_PLAN_ID_STARTER: ${RAZORPAY_PLAN_ID_STARTER}
      RAZORPAY_PLAN_ID_GROWTH: ${RAZORPAY_PLAN_ID_GROWTH}
      MSG91_AUTH_KEY: ${MSG91_AUTH_KEY}
      MSG91_SENDER_ID: ${MSG91_SENDER_ID:-GRWLKL}
      MSG91_OTP_TEMPLATE_ID: ${MSG91_OTP_TEMPLATE_ID}
      PRICE_STARTER_PAISE: ${PRICE_STARTER_PAISE:-99900}
      PRICE_GROWTH_PAISE: ${PRICE_GROWTH_PAISE:-249900}
    ports:
      - "127.0.0.1:3000:3000"
    deploy:
      resources:
        limits:
          memory: 2000M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  worker:
    build:
      context: ..
      dockerfile: apps/api/Dockerfile
    container_name: growlokal_prod_worker
    restart: always
    command: ["node", "dist/worker.js"]
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://${PG_USER:-growlokal}:${PG_PASSWORD}@postgres:5432/${PG_DB:-growlokal}
      REDIS_URL: redis://redis:6379
      GOOGLE_PLACES_API_KEY: ${GOOGLE_PLACES_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      WHATSAPP_RENEWAL_TEMPLATE_NAME: ${WHATSAPP_RENEWAL_TEMPLATE_NAME}
      WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_NAME: ${WHATSAPP_PAYMENT_CONFIRMATION_TEMPLATE_NAME}
      DASHBOARD_LOGIN_URL: https://${WEB_DOMAIN:-app.growlokal.com}/login
      SES_REGION: ${SES_REGION:-ap-south-1}
      SES_ACCESS_KEY_ID: ${SES_ACCESS_KEY_ID}
      SES_SECRET_ACCESS_KEY: ${SES_SECRET_ACCESS_KEY}
      EMAIL_FROM: ${EMAIL_FROM:-hello@growlokal.com}
      # checkWeeklyAutoPosts() (2026-08-18) generates + images + publishes —
      # needs the same content/image/publishing config the api service has,
      # minus the HTTP-route-only stuff (JWT_SECRET, RAZORPAY_*, MSG91_*,
      # PRICE_*_PAISE) the worker process never touches.
      LLM_PROVIDER: ${LLM_PROVIDER:-gemini}
      LLM_MODEL_CHEAP: ${LLM_MODEL_CHEAP}
      LLM_MODEL_QUALITY: ${LLM_MODEL_QUALITY}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY}
      OPENROUTER_MODEL_CHEAP: ${OPENROUTER_MODEL_CHEAP}
      OPENROUTER_MODEL_QUALITY: ${OPENROUTER_MODEL_QUALITY}
      OPENROUTER_MODEL_IMAGE: ${OPENROUTER_MODEL_IMAGE}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      R2_ACCOUNT_ID: ${R2_ACCOUNT_ID}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      R2_BUCKET: ${R2_BUCKET:-growlokal-media}
      R2_PUBLIC_URL_BASE: ${R2_PUBLIC_URL_BASE}
      GBP_ACCESS_TOKEN: ${GBP_ACCESS_TOKEN}
      GBP_CLIENT_ID: ${GBP_CLIENT_ID}
      GBP_CLIENT_SECRET: ${GBP_CLIENT_SECRET}
      MIXPOST_BASE_URL: ${MIXPOST_BASE_URL}
      MIXPOST_TOKEN: ${MIXPOST_TOKEN}
      MIXPOST_WORKSPACE_UUID: ${MIXPOST_WORKSPACE_UUID}
    # 256M, not 500M like api — it's a 60s/6h poll loop, not a request server.
    # Running total with this added: postgres 3500M + redis 1500M + api 2000M
    # + worker 256M + caddy 500M = 7756M of an 8GB VPS. That's the ceiling —
    # no more services fit here without either raising the VPS or trimming
    # postgres/redis limits.
    deploy:
      resources:
        limits:
          memory: 256M
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started

  caddy:
    image: caddy:2-alpine
    container_name: growlokal_prod_caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    environment:
      API_DOMAIN: ${API_DOMAIN:-api.growlokal.com}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    deploy:
      resources:
        limits:
          memory: 500M
    depends_on:
      - api

volumes:
  pg_prod_data:
  redis_prod_data:
  caddy_data:
  caddy_config:
