# Self-hosted stack for home-lab box #1 (8GB RAM laptop) — Docker host.
# TOOLS ONLY — nothing revenue-critical runs here. The API, its Postgres/Redis,
# and the scheduler worker all run on the VPS now (infra/docker-compose.prod.yml)
# — see docs/DECISIONS.md (2026-08-18). This box runs n8n + Kuma + Twenty.
# The heavier tools below (Chatwoot, Mixpost, Cal.com, Metabase, Listmonk) are
# for box #2, a second machine, once it's set up.
#
# Each tool here is self-contained (own storage, no shared Postgres/Redis
# between tools) — a bug in one can't take down another.
#
# Usage: docker compose up -d n8n kuma twenty-db twenty-redis twenty-server twenty-worker
# Secrets come from an .env file in this dir (NOT committed).
version: "3.8"

services:
  # n8n ships with its own embedded SQLite by default — no Postgres needed
  # for this workload (a handful of scheduling workflows, not high-throughput
  # queue mode). Simpler and one less shared dependency than pointing it at a
  # Postgres database that, until now, was never actually created.
  n8n:
    image: docker.n8n.io/n8nio/n8n
    restart: always
    ports:
      - "5678:5678"
    environment:
      N8N_HOST: n8n.growlokal.com
      N8N_PROTOCOL: https
      WEBHOOK_URL: https://n8n.growlokal.com/
      GENERIC_TIMEZONE: Asia/Kolkata
      # Put n8n behind Cloudflare Access — do NOT rely on this alone:
      N8N_BASIC_AUTH_ACTIVE: "true"
      N8N_BASIC_AUTH_USER: ${N8N_USER:-admin}
      N8N_BASIC_AUTH_PASSWORD: ${N8N_PASSWORD:?set N8N_PASSWORD}
    volumes:
      - n8n_data:/home/node/.n8n

  # Monitoring — is the VPS API / this box's own tools up or down?
  # SQLite, zero extra DB, single container. Dashboard at :3001.
  kuma:
    image: louislam/uptime-kuma:1
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - kuma_data:/app/data

  # ── Internal CRM (admin/finance: leads, deals, revenue — not customer-facing) ──
  # Runs its OWN postgres/redis (twenty-db / twenty-redis below) — separate from
  # n8n's storage above and, critically, from the VPS's production database.
  # A CRM migration or compromise must never be able to touch production data.
  # This mirrors Twenty's own supported
  # docker-compose (https://github.com/twentyhq/twenty/blob/main/packages/twenty-docker/docker-compose.yml) —
  # verify against that upstream file before first deploy, Twenty's self-host
  # config changes between versions.
  twenty-db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: ${TWENTY_PG_USER:-twenty}
      POSTGRES_PASSWORD: ${TWENTY_PG_PASSWORD:?set TWENTY_PG_PASSWORD in infra/.env}
      POSTGRES_DB: ${TWENTY_PG_DB:-default}
    volumes:
      - twenty_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${TWENTY_PG_USER:-twenty}"]
      interval: 10s
      timeout: 5s
      retries: 5

  twenty-redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --maxmemory-policy noeviction

  twenty-server:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    restart: always
    ports:
      - "3010:3000"
    environment:
      PG_DATABASE_HOST: twenty-db
      PG_DATABASE_PORT: 5432
      PG_DATABASE_USER: ${TWENTY_PG_USER:-twenty}
      PG_DATABASE_PASSWORD: ${TWENTY_PG_PASSWORD}
      REDIS_URL: redis://twenty-redis:6379
      SERVER_URL: https://crm.growlokal.com
      # openssl rand -base64 32 — losing this loses every secret Twenty stores
      # (OAuth tokens, app variables, TOTP secrets). Back it up somewhere safe.
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY:?set TWENTY_ENCRYPTION_KEY in infra/.env}
      STORAGE_TYPE: local
    volumes:
      - twenty_server_data:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty-db:
        condition: service_healthy
      twenty-redis:
        condition: service_started

  twenty-worker:
    image: twentycrm/twenty:${TWENTY_TAG:-latest}
    restart: always
    command: ["yarn", "worker:prod"]
    environment:
      PG_DATABASE_HOST: twenty-db
      PG_DATABASE_PORT: 5432
      PG_DATABASE_USER: ${TWENTY_PG_USER:-twenty}
      PG_DATABASE_PASSWORD: ${TWENTY_PG_PASSWORD}
      REDIS_URL: redis://twenty-redis:6379
      SERVER_URL: https://crm.growlokal.com
      ENCRYPTION_KEY: ${TWENTY_ENCRYPTION_KEY}
      STORAGE_TYPE: local
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes:
      - twenty_server_data:/app/packages/twenty-server/.local-storage
    depends_on:
      twenty-db:
        condition: service_healthy

  # ── Add these on the SECOND home-lab box once you set it up (RAM: this box
  # is already at its comfortable ceiling with n8n + Kuma + Twenty on 8GB) ──

  # typebot-builder + typebot-viewer: the free audit-bot flow builder
  #   https://docs.typebot.io/self-hosting/docker-compose

  # chatwoot: WhatsApp shared inbox / chat agent
  #   https://www.chatwoot.com/docs/self-hosted

  # mixpost: Instagram/Facebook scheduling
  #   https://docs.mixpost.app/

  # cal: "book a free demo class" booking
  #   https://github.com/calcom/docker

  # metabase: ROI dashboard
  #   image: metabase/metabase (point at the growlokal DB, read-only user)

  # listmonk: email campaigns (+ Amazon SES as SMTP)
  #   https://listmonk.app/docs/installation/

volumes:
  n8n_data:
  kuma_data:
  twenty_db_data:
  twenty_server_data:
